[project]
name = "psiapp"
description = "Tools for supporting experiment launchers using psiexperiment"
requires-python = ">=3.10"
license = {file = "license.txt"}
authors = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
maintainers = [
    {name = "Brad Buran", email="buran@ohsu.edu"},
]
dependencies = [
    "enaml >=0.13.0",
    "psiexperiment",
]
dynamic = ["version"]

[project.optional-dependencies]
# Only needed to (re)generate launcher icons with psiapp.icons -- the icons
# themselves ship as image files, so running a launcher never needs these.
icons = ["matplotlib", "pillow"]
test = ["pytest", "matplotlib", "pillow"]

[build-system]
requires = ["setuptools>=61.2", "wheel", "setuptools_scm[toml]>=3.4.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "psiapp/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: runs tests that will otherwise be skipped because they are slow"
]
